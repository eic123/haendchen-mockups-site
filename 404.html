<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Weiterleitung</title>
<link rel="icon" href="data:,">
<script>
// GitHub Pages serves this for every unknown path, e.g. a deep link into ./app/ before the service
// worker is installed. Send it to the password page and remember where it wanted to go.
(function () {
  var path = location.pathname, i = path.indexOf("/app/");
  var base = i >= 0 ? path.slice(0, i + 1) : "/";
  var to = i >= 0 ? path.slice(i + 5) : "";
  location.replace(base + (to ? "?to=" + encodeURIComponent(to) : "") + location.hash);
})();
</script></head><body></body></html>
